name: Image performance and correctness

on:
  push:
    paths:
      - 'src/image/**'
      - 'src/app/app-shell*'
      - 'src/shared/**'
      - 'dev/image-performance*'
      - '.github/workflows/image-performance.yml'
      - 'package*.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: current
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - name: Check out the pre-optimization comparison
        uses: actions/checkout@v4
        with:
          ref: aef6295ee470dbacff6207e699094486e8f1531f
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            current/package-lock.json
            baseline/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: baseline
      - run: npm run build
      - run: npm run build
        working-directory: baseline
      - run: npx playwright install --with-deps chromium
      - name: Existing Image, recorded edits, and interruption regressions
        run: npx playwright test --config dev/image-performance.playwright.config.ts src/image/image-workspace.browser.spec.ts src/image/image-automation.browser.spec.ts src/image/image-touch.browser.spec.ts --grep 'IMAGE-APP|PU-10/11/12|TOUCH-03'
      - name: Compare the same large-image interactions on both builds
        env:
          GSNV_BASELINE_DIST: ${{ github.workspace }}/baseline/dist
          GSNV_BASELINE_REV: aef6295ee470dbacff6207e699094486e8f1531f
          GSNV_CURRENT_REV: ${{ github.sha }}
        run: npx playwright test --config dev/image-performance.playwright.config.ts dev/image-performance.browser.spec.ts
      - name: Summarize measured interaction times
        if: always()
        run: node dev/image-performance-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-performance
          path: current/test-results/image-performance
          if-no-files-found: ignore
