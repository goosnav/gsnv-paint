<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gsnv-paint · Development integration fixture</title>
<link rel="stylesheet" href="/src/shared/chrome.css">
<link rel="stylesheet" href="/src/shared/dialog.css">
<style>
html,body { margin:0; width:100%; height:100%; font:12px Tahoma,Arial,sans-serif; background:#ece9d8; color:#172232; }
#fixture-notice { box-sizing:border-box; position:relative; height:40px; padding:6px 10px; background:#fff8d4; border-bottom:1px solid #b7a65f; }
#fixture-notice strong { display:block; }
#fixture-ready { position:absolute; right:10px; top:6px; font-size:11px; }
#app { height:calc(100% - 40px); }
.fixture-stage { position:absolute; inset:0; padding:24px; transform-origin:0 0; }
.fixture-stage h2 { margin:0 0 10px; font-size:16px; }
.fixture-stage p { max-width:420px; line-height:1.5; }
.fixture-pixel { display:block; width:64px; height:64px; image-rendering:pixelated; outline:1px solid #445263; }
.fixture-stage [hidden] { display:none; }
.fixture-panel { padding:10px; line-height:1.5; }
</style>
<div id="fixture-notice"><strong>Development integration fixture</strong>Literal 1 × 1 sample documents; no CAD, Image or Video editor.<span id="fixture-ready">Starting shared shell…</span></div>
<main id="app"></main>
<script type="module" src="/src/app/app-shell.demo.ts"></script>
</html>
